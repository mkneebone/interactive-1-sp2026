<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anna CSS Typeface</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <main class="alphabet-grid">
      <!-- C -->
      <section class="letter letter-c" aria-label="C">
        <aside class="tri-pair" aria-hidden="true">
          <span class="tri tri-1"></span>
          <span class="tri tri-2"></span>
        </aside>
        <div class="glyph">
          <div class="spine"></div>
          <div class="top-bar"></div>
          <div class="bottom-bar"></div>
          <div class="right-cut cut"></div>
        </div>
      </section>

      <!-- E -->
      <section class="letter letter-e" aria-label="E">
        <aside class="tri-pair" aria-hidden="true">
          <span class="tri tri-1"></span>
          <span class="tri tri-2"></span>
        </aside>
        <div class="glyph">
          <div class="spine"></div>
          <div class="top-bar"></div>
          <div class="mid-bar"></div>
          <div class="bottom-bar"></div>
        </div>
      </section>

      <!-- F -->
      <section class="letter letter-f" aria-label="F">
        <aside class="tri-pair" aria-hidden="true">
          <span class="tri tri-1"></span>
          <span class="tri tri-2"></span>
        </aside>
        <div class="glyph">
          <div class="spine"></div>
          <div class="top-bar"></div>
          <div class="mid-bar"></div>
        </div>
      </section>

      <!-- G -->
      <section class="letter letter-g" aria-label="G">
        <aside class="tri-pair" aria-hidden="true">
          <span class="tri tri-1"></span>
          <span class="tri tri-2"></span>
        </aside>
        <div class="glyph">
          <div class="spine"></div>
          <div class="top-bar"></div>
          <div class="bottom-bar"></div>
          <div class="right-cut cut"></div>
          <div class="mid-bar"></div>
          <div class="right-stem"></div>
        </div>
      </section>

      <!-- H -->
      <section class="letter letter-h" aria-label="H">
        <aside class="tri-pair" aria-hidden="true">
          <span class="tri tri-1"></span>
          <span class="tri tri-2"></span>
        </aside>
        <div class="glyph">
          <div class="left-spine"></div>
          <div class="right-spine"></div>
          <div class="mid-bar"></div>
        </div>
      </section>
    </main>
  </body>
</html>
