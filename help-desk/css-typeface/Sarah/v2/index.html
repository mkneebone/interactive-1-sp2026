<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sarah CSS Typeface</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <section id="letter-a">
      <div class="cell"></div>

      <div class="cell shift">
        <div class="outer-circle">
          <div class="inner-circle"></div>
        </div>
      </div>

      <div class="cell r90">
        <div class="outer-circle">
          <div class="inner-circle"></div>
        </div>
      </div>

      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>

      <div class="cell r270 shift">
        <div class="stroke"></div>
      </div>

      <div class="cell r90">
        <div class="stroke"></div>
      </div>

      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>

      <div class="cell r270 shift">
        <div class="stroke"></div>
      </div>

      <div class="cell r90">
        <div class="stroke"></div>
      </div>

      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>

      <div class="cell r180">
        <div class="outer-circle">
          <div class="inner-circle"></div>
        </div>
      </div>
    </section>
  </body>
</html>
