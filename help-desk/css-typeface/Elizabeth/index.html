<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <!-- letter a -->
    <section id="letter-a">
      <!-- leaf -->
      <div class="box" id="b1">
        <div class="ink">
          <div class="circle" id="c1"></div>
          <div class="circle" id="c2"></div>
        </div>
      </div>

      <!-- rotated leaf (270°) -->
      <div class="box r270">
        <div class="ink">
          <div class="circle" id="c1"></div>
          <div class="circle" id="c2"></div>
        </div>
      </div>

      <!-- inverted leaf, no border-->
      <div class="box invert no-border">
        <div class="circle" id="c1"></div>
        <div class="circle" id="c2"></div>
      </div>

      <!-- box with boarder -->
      <div class="box"></div>

      <!-- inverted box -->
      <div class="box invert"></div>
    </section>
  </body>
</html>
