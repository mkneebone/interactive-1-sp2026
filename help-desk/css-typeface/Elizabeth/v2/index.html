<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <!-- Parts for reference (uncomment to use): -->
    <!-- inverted leaf, no border-->

    <!-- box with border -->

    <!-- inverted box -->
    <!-- <div class="box invert"></div> -->

    <!-- letter c -->
    <section id="letter-c">
      <div class="box"></div>

      <!-- leaf -->
      <div class="box" id="b1">
        <div class="ink">
          <div class="circle" id="c1"></div>
          <div class="circle" id="c2"></div>
        </div>
      </div>

      <!-- rotated leaf (270°) -->
      <div class="box r270">
        <div class="ink">
          <div class="circle" id="c1"></div>
          <div class="circle" id="c2"></div>
        </div>
      </div>

      <div class="box"></div>
      <div class="box no-border"></div>
      <div class="box no-border"></div>
      <div class="box"></div>
      <div class="box no-border"></div>
      <div class="box no-border"></div>
      <div class="box"></div>
      <div class="box no-border"></div>
      <div class="box no-border"></div>
      <div class="box"></div>

      <div class="box r270">
        <div class="ink">
          <div class="circle" id="c1"></div>
          <div class="circle" id="c2"></div>
        </div>
      </div>

      <div class="box" id="b1">
        <div class="ink">
          <div class="circle" id="c1"></div>
          <div class="circle" id="c2"></div>
        </div>
      </div>
    </section>

    <!-- letter u -->
    <section id="letter-u">
      <div class="box-u invert no-border">
        <div class="circle" id="c1"></div>
        <div class="circle" id="c2"></div>
      </div>

      <div class="box-u invert no-border r90">
        <div class="circle" id="c1"></div>
        <div class="circle" id="c2"></div>
      </div>

      <div class="box-u no-border"></div>

      <div class="box-u invert no-border">
        <div class="circle" id="c1"></div>
        <div class="circle" id="c2"></div>
      </div>

      <div class="box-u invert no-border r90">
        <div class="circle" id="c1"></div>
        <div class="circle" id="c2"></div>
      </div>

      <div class="box-u" id="b1">
        <div class="ink">
          <div class="circle" id="c1"></div>
          <div class="circle" id="c2"></div>
        </div>
      </div>

      <div class="box-u r270">
        <div class="ink">
          <div class="circle" id="c1"></div>
          <div class="circle" id="c2"></div>
        </div>
      </div>

      <div class="box-u no-border"></div>

      <div class="box-u" id="b1">
        <div class="ink">
          <div class="circle" id="c1"></div>
          <div class="circle" id="c2"></div>
        </div>
      </div>

      <div class="box-u r270">
        <div class="ink">
          <div class="circle" id="c1"></div>
          <div class="circle" id="c2"></div>
        </div>
      </div>
    </section>
